squads:
  main:
    display_name: "Tiểu đội 2"
    sheet_tab_gate_duty: "Lịch Trực Cổng & Phân Công Nhiệm Vụ Tiểu Đội"
    header_style: two_row_merged
    overnight: false
    send_next_day: true          # Tự động gửi lịch ngày mai vào buổi tối hôm trước
    next_day_cutover_time: "20:00" # Từ 20:00 tối trở đi sẽ lấy lịch của ngày mai
  culi:
    display_name: "Tiểu đội culi"
    sheet_tab_gate_duty: "Lịch trực cổng tiểu đội culi"
    header_style: single_row
    overnight: true
    cutover_time: "05:30"

recipients:
  admin: "$ADMIN_CHAT_ID"
  squad_main: "$SQUAD_MAIN_CHAT_ID"
  squad_culi: "$SQUAD_CULI_CHAT_ID"
  platoon_leader: "$PLATOON_LEADER_CHAT_ID"
  squad_partner: "$SQUAD_PARTNER_CHAT_ID"

schedules:
  - key: main_duty
    label: "Lịch trực cổng Tiểu đội 2"
    squad: main
    type: gate_duty
    recipients:
      - squad_main
    auto_send_time: "20:00"     # Gửi lúc 20:00 lịch ngày mai
    enabled: true

  - key: culi_duty
    label: "Lịch trực cổng Tiểu đội culi"
    squad: culi
    type: gate_duty
    recipients:
      - squad_culi
    auto_send_time: "19:30"     # Gửi lúc 19:30 lịch đêm nay
    enabled: true

  - key: patrol_summary
    label: "Lịch đi tuần Tiểu đội 2 (Gửi Trung đội trưởng)"
    squad: main
    type: gate_duty_patrol_only
    recipients:
      - platoon_leader
    auto_send_time: "21:00"     # Gửi lúc 21:00 tối hôm trước
    enabled: true

  - key: squad_leave
    label: "Lịch tranh thủ Tiểu đội 2"
    squad: main
    type: leave_roster
    sheet_tab: "Lịch tranh thủ tiểu đội 2"
    recipients:
      - squad_main
    auto_send_time: null
    enabled: true

  - key: leave_stats
    label: "Thống kê tranh thủ Tiểu đội 2"
    squad: main
    type: leave_roster_stats
    sheet_tab: "Lịch tranh thủ tiểu đội 2"
    recipients:
      - squad_main
    auto_send_time: null
    enabled: true

reminders:
  - schedule_key: main_duty
    remind_before_send_minutes: 60  # Nhắc Admin lúc 19:00 (trước giờ gửi 1 tiếng)
    remind_if_not_sent_by: "20:10"  # Cảnh báo nếu qua 20:10 chưa gửi thành công
  - schedule_key: culi_duty
    remind_before_send_minutes: 60  # Nhắc Admin lúc 18:30
    remind_if_not_sent_by: "19:40"
